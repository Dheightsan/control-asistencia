# Solo la base de datos, para quien tenga Docker. No esta probado en esta maquina (sin Docker).
# Deja el puerto 54329 igual que .env.example, asi la API usa el mismo DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: asistencia
      POSTGRES_DB: asistencia
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia"]
      interval: 5s
      timeout: 3s
      retries: 10
